name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses5-dev libssl-dev python3 python3-pip bc libelf-dev
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          # Persist ~/.bin on PATH for every later step in this job (no need to
          # re-export PATH manually in each step anymore).
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync Manifest
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android16-6.12 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          git config --global user.email "ci@ci.local"
          git config --global user.name "CI"
          # commit initial sync state supaya git status bersih
          repo forall -c 'git add -A && git commit -q -m "ci: sync" --allow-empty || true'

      - name: Patches
        run: |
          cd android-kernel/common
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s master
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          # setup.sh scripts create drivers/kernelsu and fs/nomount as symlinks
          # pointing OUTSIDE the common/ Bazel package (e.g. ../../KernelSU).
          # Bazel's hermetic sandbox only stages files inside the package it's
          # building, so a symlink pointing outside common/ resolves to nothing
          # inside the sandbox — this is what produced the
          # "Can't find ReSukiSU git submodule!" error during the Bazel build.
          # Fix: dereference the symlinks into real copied files so they're
          # guaranteed to be part of the common/ tree Bazel actually sees.
          for d in drivers/kernelsu fs/nomount; do
            if [ -L "$d" ]; then
              target=$(readlink -f "$d")
              rm "$d"
              cp -r "$target" "$d"
              echo "[fix] Dereferenced symlink -> real copy: $d"
            fi
          done

          # Fail fast with a clear message if setup didn't actually produce the
          # driver sources, instead of letting Bazel fail deep in the build with
          # a confusing error.
          test -f drivers/kernelsu/Makefile || { echo "::error::drivers/kernelsu is missing after setup — clone/symlink step failed"; exit 1; }

      - name: Debug - locate error source (remove once confirmed fixed)
        if: always()
        run: |
          grep -rn "Can't find ReSukiSU git submodule" android-kernel/common || echo "String not found in common/ tree (good, or setup failed earlier)."

      - name: Merge Fragments
        run: |
          if [ -d "$GITHUB_WORKSPACE/fragments" ]; then
            for fragment in "$GITHUB_WORKSPACE"/fragments/*; do
              if [ -f "$fragment" ]; then
                cat "$fragment" >> android-kernel/common/arch/arm64/configs/gki_defconfig
              fi
            done
          fi

      - name: Commit tree
        run: |
          cd android-kernel
          repo forall -c 'git add -A && git commit -q -m "ci: apply patches" --allow-empty || true'

      - name: Build GKI Kernel with Bazel
        run: |
          cd android-kernel
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          # --config=local disables Bazel's hermetic sandbox for most actions.
          # This is required because ReSukiSU's own drivers/kernelsu/Makefile
          # runs `git describe`/`git rev-list` to compute KSU_GIT_VERSION, but
          # Bazel's default sandbox does NOT copy .git directories into the
          # sandboxed execroot — so that git command fails inside the sandbox,
          # and the Makefile misreports it as "can't find git submodule".
          # Building --config=local uses the real checkout (with .git intact)
          # for these actions instead. See:
          # https://android.googlesource.com/kernel/build/+/main/kleaf/docs/sandbox.md
          tools/bazel run --config=local --lto=thin //common:kernel_aarch64_dist -- --dist_dir=out/dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-android16-6.12
          path: |
            android-kernel/out/dist/Image*
            android-kernel/out/dist/vmlinux*
