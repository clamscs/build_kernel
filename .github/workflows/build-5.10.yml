name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 15

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev python3 python3-pip
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

      - name: Sync Manifest
        run: |
          export PATH="${HOME}/.bin:${PATH}"
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Patches
        run: |
          cd android-kernel
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s master
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          cp -r susfs/kernel_patches/fs/* common/fs/
          cp -r susfs/kernel_patches/include/linux/* common/include/linux/
          cd common
          patch -p1 --forward < ../susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ..

      - name: Merge Fragments
        run: |
          if [ -d "$GITHUB_WORKSPACE/fragments" ]; then
            for fragment in "$GITHUB_WORKSPACE"/fragments/*; do
              if [ -f "$fragment" ]; then
                cat "$fragment" >> android-kernel/common/arch/arm64/configs/gki_defconfig
              fi
            done
          fi

      - name: Build GKI Kernel
        run: |
          export PATH="${HOME}/.bin:${PATH}"
          cd android-kernel
          find . -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +
          find . -type f -name "setlocalversion" -exec sed -i 's/-dirty//g' {} +
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-android12-5.10
          path: |
            android-kernel/out/android12-5.10/dist/Image*
